[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xoin-py"
version = "0.1.0"
description = "Structured LLM responses across OpenAI, Anthropic, DeepSeek, and Mistral (async, Pydantic schemas)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xoin" }]
keywords = ["llm", "openai", "anthropic", "structured-output", "pydantic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "pyyaml>=6,<7"]
templates = ["pyyaml>=6,<7"]
examples = ["pyyaml>=6,<7"]

[project.urls]
Homepage = "https://github.com/kanha95/xoin"
Repository = "https://github.com/kanha95/xoin"
Issues = "https://github.com/kanha95/xoin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xoin"]

[tool.hatch.build.targets.sdist]
include = ["src/xoin", "README.md", "pyproject.toml", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
